server:
  port: 8089

spring:
  application:
    name: mail-fanout-service

  cloud:
    function:
      definition: announcementCreatedEventConsumer
    stream:
      bindings:
        announcementCreatedEventConsumer-in-0:
          destination: announcements_created
          group: ${spring.application.name}
        announcementCreatedEventConsumer-out-0:
          destination: fanout_tasks

mail:
  fanout:
    service:
      batch:
        size: 1000

userservice:
  url: http://user-service:8095
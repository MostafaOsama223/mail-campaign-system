services:
  mail-campaign-system-db:
    image: postgres:14-alpine
    restart: always
    container_name: mail-campaign-system-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail_campaign_system
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "root", "-d", "mail_campaign_system"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - custom_network

  mail-campaign-system-rabbitmq:
    image: rabbitmq:3.13-management
    restart: always
    container_name: mail-campaign-system-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
#    networks:
#      - custom_network

networks:
  custom_network:
    driver: bridge